<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>routine-viz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>routine-viz</h1>
    <div class="actions">
      <button id="copy-prompt" type="button">Copy prompt mẫu</button>
      <button id="share" type="button">Copy link chia sẻ</button>
      <button id="png" type="button">Xuất PNG</button>
      <label class="btn">Tải file .txt<input id="file" type="file" accept=".txt,text/plain" hidden></label>
    </div>
  </header>
  <main>
    <section class="editor">
      <textarea id="src" spellcheck="false" placeholder="Dán thời gian biểu vào đây…"></textarea>
      <ul id="issues" aria-live="polite"></ul>
    </section>
    <section class="view">
      <div id="pills" role="tablist"></div>
      <ul id="stats"></ul>
      <div id="timeline"></div>
    </section>
  </main>
  <script src="vendor/lz-string.min.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
