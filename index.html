<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="doc.title">dayline - daily schedule</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/ibm-plex-sans-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/ibm-plex-sans-vietnamese-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/ibm-plex-mono-latin-400-normal.woff2">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l4 -4l-4 -4"/><path d="M19 10h-11a4 4 0 1 0 0 8h1"/></symbol>
      <symbol id="i-revert" viewBox="0 0 24 24"><path d="M19.95 11a8 8 0 1 0 -.5 4m.5 5v-5h-5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M17 7l-10 10"/><path d="M8 7l9 0l0 9"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12l14 0"/><path d="M13 18l6 -6"/><path d="M13 6l6 6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12l14 0"/></symbol>
    </defs>
  </svg>
  <header>
    <div class="brand">
      <img src="favicon.svg" alt="" width="36" height="36">
      <h1>dayline</h1>
      <span class="crumb" aria-hidden="true">/</span>
      <span class="crumb" data-i18n="brand.crumb">Planner</span>
    </div>
    <div class="head-actions">
      <div id="lang" role="group" data-i18n-aria-label="lang.switch">
        <button type="button" data-lang="vi">VI</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button id="share" class="plain" type="button" data-i18n="btn.share">Copy link</button>
      <button id="png" class="outline" type="button" data-i18n="btn.png">Export PNG</button>
    </div>
  </header>
  <nav id="panes" role="tablist">
    <button id="pane-edit" type="button" role="tab" data-pane="edit" data-i18n="pane.edit">Edit</button>
    <button id="pane-view" type="button" role="tab" data-pane="view" data-i18n="pane.view">Timeline</button>
  </nav>
  <main>
    <section class="editor page">
      <h2 data-i18n="editor.title">Schedule text</h2>
      <div class="tools" role="toolbar" data-i18n-aria-label="editor.title">
        <button id="undo" type="button" title="Ctrl+Z"><svg class="ic"><use href="#i-undo"/></svg><span data-i18n="btn.undo">Undo</span></button>
        <button id="redo" type="button" title="Ctrl+Shift+Z"><svg class="ic"><use href="#i-redo"/></svg><span data-i18n="btn.redo">Redo</span></button>
        <button id="revert" type="button"><svg class="ic"><use href="#i-revert"/></svg><span data-i18n="btn.revert">Restore original</span></button>
        <button id="open" type="button"><svg class="ic"><use href="#i-file"/></svg><span data-i18n="btn.file">Open .txt file</span></button>
        <input id="file" type="file" accept=".txt,text/plain" hidden>
      </div>
      <div class="code">
        <div id="hl" hidden></div>
        <div id="gutter" aria-hidden="true"><div id="nums"></div></div>
        <textarea id="src" wrap="off" spellcheck="false" data-i18n-placeholder="editor.placeholder"></textarea>
      </div>
      <div class="flow">
        <strong data-i18n="flow.title">Edit with ChatGPT</strong>
        <ol>
          <li><button id="copy-prompt" class="step" type="button" data-i18n="btn.copyPrompt">Copy prompt template</button></li>
          <li><svg class="ic arrow" aria-hidden="true"><use href="#i-arrow"/></svg></li>
          <li><a class="step" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer"><span data-i18n="flow.chatgpt">Edit in ChatGPT</span> <svg class="ic" aria-hidden="true"><use href="#i-ext"/></svg></a></li>
          <li><svg class="ic arrow" aria-hidden="true"><use href="#i-arrow"/></svg></li>
          <li><span class="step" data-i18n="flow.paste">Paste text</span></li>
        </ol>
      </div>
      <div class="status">
        <p id="count" aria-live="polite"></p>
        <button id="syntax" class="link" type="button" data-i18n="syntax.link">Syntax</button>
      </div>
      <ul id="issues" aria-live="polite"></ul>
    </section>
    <section class="view page">
      <div class="vhead">
        <h2 data-i18n="preview.title">Preview</h2>
        <div class="zoom" role="group" data-i18n-aria-label="zoom.label">
          <button id="zoom-out" type="button" data-i18n-aria-label="zoom.out"><svg class="ic"><use href="#i-minus"/></svg></button>
          <output id="zoom-val" aria-live="polite"></output>
          <button id="zoom-in" type="button" data-i18n-aria-label="zoom.in"><svg class="ic"><use href="#i-plus"/></svg></button>
        </div>
        <label class="full"><input id="full" type="checkbox"> <span data-i18n="toolbar.full">Show full 24h</span></label>
      </div>
      <h3 id="gtitle"></h3>
      <div id="pills" role="tablist"></div>
      <ul id="stats"></ul>
      <div id="timeline"></div>
      <img id="mascot" src="assets/capybara.webp" alt="" data-i18n-alt="mascot.alt">
    </section>
  </main>
  <dialog id="syntax-dlg" aria-labelledby="syntax-title">
    <h2 id="syntax-title" data-i18n="syntax.link">Syntax</h2>
    <ul id="syntax-body"></ul>
    <form method="dialog"><button class="outline" data-i18n="syntax.close">Close</button></form>
  </dialog>
  <dialog id="export-dlg" aria-labelledby="export-title">
    <h2 id="export-title" data-i18n="export.title">Export PNG</h2>
    <p class="hint" data-i18n="export.choose">Choose days to export</p>
    <div class="row">
      <button id="export-all" class="link" type="button" data-i18n="export.all">Select all</button>
      <button id="export-none" class="link" type="button" data-i18n="export.none">Select none</button>
    </div>
    <div id="export-list" role="group" data-i18n-aria-label="export.choose"></div>
    <fieldset>
      <label><input id="export-combine" type="radio" name="export-mode" checked> <span data-i18n="export.combine">Combine into one image</span></label>
      <label><input id="export-separate" type="radio" name="export-mode"> <span data-i18n="export.separate">One image per day</span></label>
    </fieldset>
    <div class="actions">
      <button id="export-cancel" class="plain" type="button" data-i18n="export.cancel">Cancel</button>
      <button id="export-go" class="outline" type="button" data-i18n="export.go">Export</button>
    </div>
  </dialog>
  <div id="selbar" hidden>
    <button id="sel-del" type="button" data-i18n="btn.delete">Delete</button>
    <button id="sel-clear" type="button" data-i18n="btn.deselect">Deselect</button>
  </div>
  <script src="vendor/lz-string.min.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
